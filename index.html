<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Homenagem Especial</title>
    <link rel="stylesheet" href="coração.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="main-container" id="tela-inicial">
        <button id="botao-ler" class="botao-ler">
            <svg viewBox="0 0 32 29.6">
                <path d="M23.6,0c-3.4,0-6.3,2.7-7.6,5.6C14.7,2.7,11.8,0,8.4,0C3.8,0,0,3.8,0,8.4c0,9.4,9.5,11.9,16,21.2
                c6.1-9.3,16-12.1,16-21.2C32,3.8,28.2,0,23.6,0z"/>
            </svg>
            <span class="texto-botao">Feliz Dia das Mães!</span>
        </button>
    </div>

    <div id="fase-carta" class="hidden">
        <div class="carta-box">
            <img src="coracao.gif" alt="Coração" class="carta-image esq">
            <img src="coracao.gif" alt="Coração" class="carta-image dir">
            
            <div class="carta-header">Para a Melhor Mãe do Mundo</div>
            <div class="divisor"></div>
            <p class="carta-texto">
                Querida Mãe,<br><br>
                Você é a minha maior inspiração e quem me dá forças para vencer qualquer desafio na vida.<br><br>
                Obrigado por acreditar em mim quando não acreditava.<br><br> 
                Obrigado por estar em minha vida.<br><br>
                Te amo infinitamente!<br><br>
                <strong>Com amor, Marcelo</strong>
            </p>
        </div>
    </div>

    <script src="comando.js"></script>
</body>
</html>
